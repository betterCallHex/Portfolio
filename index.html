<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Yunes Maghsoudie — Front-end developer</title>
    <meta
      name="description"
      content="Yunes Maghsoudie is a front-end developer building fast, considered interfaces with React and TypeScript."
    />
    <meta property="og:title" content="Yunes Maghsoudie — Front-end developer" />
    <meta
      property="og:description"
      content="Front-end developer building fast, considered interfaces with React and TypeScript."
    />
    <meta property="og:image" content="/images/avatar.png" />
    <meta property="og:type" content="website" />
    <script>
      try {
        const stored = localStorage.getItem('theme');
        const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
        const dark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
